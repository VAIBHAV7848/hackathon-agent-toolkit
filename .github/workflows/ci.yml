name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Structural validation
        run: python3 validate_toolkit.py
      - name: Regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q install.py validate_toolkit.py scripts tests skills
      - name: Build release archive
        run: python3 scripts/build_release.py --output-dir /tmp/toolkit-release
      - name: Verify release archive
        run: python3 -c "import zipfile,glob; p=glob.glob('/tmp/toolkit-release/*.zip')[0]; z=zipfile.ZipFile(p); assert z.testzip() is None; print(p, len(z.namelist()), 'entries')"
