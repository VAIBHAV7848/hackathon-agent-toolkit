name: Feature request
description: Propose a focused improvement with a clear user benefit.
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What cannot a user accomplish today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the behavior, not only the implementation.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and trade-offs
      description: Include reproducible examples, alternative approaches, maintenance cost, and compatibility concerns.
    validations:
      required: true
