name: Bug report
description: Report a reproducible toolkit problem.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove secrets, private project data, and personal information before posting.
  - type: input
    id: toolkit-version
    attributes:
      label: Toolkit version
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: CLI, model, version, and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include exact commands and a minimal example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant output or sanitized evidence
    validations:
      required: false
